# Local metadata-tier example. Override PLFS_IMAGE, PLFS_DATA_DIR,
# PLFS_MASTER_HOST, and PLFS_MOUNT_DIR for your deployment.
services:
  plfsmaster:
    image: ${PLFS_IMAGE:-ghcr.io/webj8/polaris-fs:latest}
    container_name: plfsmaster
    restart: unless-stopped
    network_mode: host
    environment:
      ROLE: plfsmaster
    volumes:
      - ${PLFS_DATA_DIR:-./data}/master:/var/lib/plfs

  plfsmetalogger:
    image: ${PLFS_IMAGE:-ghcr.io/webj8/polaris-fs:latest}
    container_name: plfsmetalogger
    restart: unless-stopped
    network_mode: host
    environment:
      ROLE: plfsmetalogger
      MASTER_HOST: ${PLFS_MASTER_HOST:-192.168.1.1}
    volumes:
      - ${PLFS_DATA_DIR:-./data}/metalogger:/var/lib/plfs
    depends_on:
      - plfsmaster

  plfsmount:
    image: ${PLFS_IMAGE:-ghcr.io/webj8/polaris-fs:latest}
    container_name: plfsmount
    restart: unless-stopped
    network_mode: host
    privileged: true
    devices:
      - /dev/fuse
    environment:
      ROLE: plfsmount
      MASTER_HOST: ${PLFS_MASTER_HOST:-192.168.1.1}
      MOUNT_POINT: /mnt/plfs
    volumes:
      - ${PLFS_MOUNT_DIR:-./mnt}:/mnt/plfs:shared
    depends_on:
      - plfsmaster

  plfsgui:
    image: ${PLFS_IMAGE:-ghcr.io/webj8/polaris-fs:latest}
    container_name: plfsgui
    restart: unless-stopped
    network_mode: host
    environment:
      ROLE: plfsgui
    volumes:
      - ${PLFS_DATA_DIR:-./data}/gui:/var/lib/plfs
    depends_on:
      - plfsmaster
