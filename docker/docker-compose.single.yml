services:
  plfsmaster:
    image: ${PLFS_IMAGE:-ghcr.io/webj8/polaris-fs:latest}
    container_name: plfsmaster
    restart: unless-stopped
    network_mode: host
    environment:
      ROLE: plfsmaster
    volumes:
      - ${PLFS_DATA_DIR:-/var/lib/polarisfs}/master:/var/lib/plfs

  plfsmetalogger:
    image: ${PLFS_IMAGE:-ghcr.io/webj8/polaris-fs:latest}
    container_name: plfsmetalogger
    restart: unless-stopped
    network_mode: host
    environment:
      ROLE: plfsmetalogger
      MASTER_HOST: ${PLFS_MASTER_HOST:?set PLFS_MASTER_HOST to this host's LAN IP}
    volumes:
      - ${PLFS_DATA_DIR:-/var/lib/polarisfs}/metalogger:/var/lib/plfs
    depends_on:
      - plfsmaster

  plfschunkserver:
    image: ${PLFS_IMAGE:-ghcr.io/webj8/polaris-fs:latest}
    container_name: plfschunkserver
    restart: unless-stopped
    network_mode: host
    environment:
      ROLE: plfschunkserver
      MASTER_HOST: ${PLFS_MASTER_HOST:?set PLFS_MASTER_HOST to this host's LAN IP}
      HDD_PATHS: /mnt/hdd/plfs
    volumes:
      - ${PLFS_DATA_DIR:-/var/lib/polarisfs}/chunkserver:/var/lib/plfs
      - ${PLFS_CHUNK_DIR:-/var/lib/polarisfs/chunks}:/mnt/hdd/plfs
    depends_on:
      - plfsmaster

  plfsmount:
    image: ${PLFS_IMAGE:-ghcr.io/webj8/polaris-fs:latest}
    container_name: plfsmount
    restart: unless-stopped
    network_mode: host
    privileged: true
    devices:
      - /dev/fuse
    environment:
      ROLE: plfsmount
      MASTER_HOST: ${PLFS_MASTER_HOST:?set PLFS_MASTER_HOST to this host's LAN IP}
      MOUNT_POINT: /mnt/plfs
    volumes:
      - ${PLFS_MOUNT_DIR:-/mnt/plfs}:/mnt/plfs:shared
    depends_on:
      - plfsmaster

  plfsgui:
    image: ${PLFS_IMAGE:-ghcr.io/webj8/polaris-fs:latest}
    container_name: plfsgui
    restart: unless-stopped
    network_mode: host
    environment:
      ROLE: plfsgui
    extra_hosts:
      - "plfsmaster:${PLFS_MASTER_HOST:?set PLFS_MASTER_HOST to this host's LAN IP}"
    volumes:
      - ${PLFS_DATA_DIR:-/var/lib/polarisfs}/gui:/var/lib/plfs
    depends_on:
      - plfsmaster
