[workspace]
resolver = "3"
members = [
    "crates/plfs",
    "crates/plfs-arena",
    "crates/plfs-client",
    "crates/plfs-common",
    "crates/plfs-data",
    "crates/plfs-meta",
    "crates/plfs-registry",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
license = "LicenseRef-TBD"

[workspace.dependencies]
# async runtime / CLI / observability / errors
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"

# data-plane gRPC (wire contract v1)
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
tokio-stream = { version = "0.1", features = ["sync", "net"] }
bytes = "1"

# workspace crates
plfs-common = { path = "crates/plfs-common" }
plfs-arena = { path = "crates/plfs-arena" }
plfs-data = { path = "crates/plfs-data" }
plfs-meta = { path = "crates/plfs-meta" }
plfs-registry = { path = "crates/plfs-registry" }
plfs-client = { path = "crates/plfs-client" }

# ChunkArena storage engine (S2)
io-uring = "0.7"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["fs", "ioctl"] }
uuid = { version = "1", features = ["v7"] }
crc32fast = "1"

# observability
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# read cache hot index (S11)
lru = "0.16"

# metadata state machine (S7)
redb = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
thiserror = "2"

# test-only
proptest = "1"
rand = "0.9"
criterion = "0.8"
