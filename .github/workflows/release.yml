name: Build

on:
  push:
    branches: [mfs-rust]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build all daemons
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse3-dev zlib1g-dev libpcap-dev

      - name: Install Rust (nightly for c_variadic/extern_types-era features)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build all daemons
        run: ./build-all.sh

      - name: Smoke-test executables
        shell: bash
        run: |
          set -euo pipefail
          dist/mfsmaster -v
          dist/mfschunkserver -v
          dist/mfsmetalogger -v
          dist/mfsgui -v
          dist/mfsmount --version
          dist/mfsbdev --help >/dev/null || true
          file dist/mfsmaster dist/mfsmount
          readelf --version-info dist/mfsmaster \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -3

      - name: Upload release executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mfs-dist-x86_64-unknown-linux-gnu
          path: |
            dist/mfsmaster
            dist/mfschunkserver
            dist/mfsmetalogger
            dist/mfsgui
            dist/mfsmount
            dist/mfsbdev
            dist/mfsnetdump
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
