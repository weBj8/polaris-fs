name: Build

on:
  push:
    branches: [mfs-rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Migration gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check migration counters
        run: bash tools/gates/check.sh

  test:
    name: Workspace tests
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -L /usr/local/lib/x86_64-linux-gnu
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes zlib1g-dev libpcap-dev meson ninja-build pkg-config curl

      - name: Cache libfuse 3.18
        id: cache-fuse
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/fuse318-installed
          key: libfuse-3.18.2-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build libfuse 3.18
        if: steps.cache-fuse.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL https://github.com/libfuse/libfuse/releases/download/fuse-3.18.2/fuse-3.18.2.tar.gz | tar xz -C /tmp
          meson setup /tmp/fuse-3.18.2/build /tmp/fuse-3.18.2 -Dexamples=false -Dtests=false -Dutils=false
          ninja -C /tmp/fuse-3.18.2/build
          sudo ninja -C /tmp/fuse-3.18.2/build install
          mkdir -p /tmp/fuse318-installed

      - name: Restore libfuse 3.18
        if: steps.cache-fuse.outputs.cache-hit == 'true'
        run: |
          sudo tar xf /tmp/fuse318-installed/install.tar -C /
          sudo ldconfig

      - name: Save libfuse 3.18
        if: steps.cache-fuse.outputs.cache-hit != 'true'
        run: |
          cd /
          sudo tar cf /tmp/fuse318-installed/install.tar \
            $(ls -d usr/local/lib/x86_64-linux-gnu/libfuse3.so* \
            usr/local/lib/x86_64-linux-gnu/pkgconfig/fuse3.pc) \
            usr/local/include/fuse3
          sudo ldconfig

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-29

      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release
          add-job-id-key: false
          cache-workspace-crates: true
          save-if: false

      - name: Test workspace
        run: cargo test --release --workspace --locked

  build:
    name: Release build and dist
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -L /usr/local/lib/x86_64-linux-gnu
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes zlib1g-dev libpcap-dev meson ninja-build pkg-config curl

      - name: Cache libfuse 3.18
        id: cache-fuse
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/fuse318-installed
          key: libfuse-3.18.2-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build libfuse 3.18
        if: steps.cache-fuse.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL https://github.com/libfuse/libfuse/releases/download/fuse-3.18.2/fuse-3.18.2.tar.gz | tar xz -C /tmp
          meson setup /tmp/fuse-3.18.2/build /tmp/fuse-3.18.2 -Dexamples=false -Dtests=false -Dutils=false
          ninja -C /tmp/fuse-3.18.2/build
          sudo ninja -C /tmp/fuse-3.18.2/build install
          mkdir -p /tmp/fuse318-installed

      - name: Restore libfuse 3.18
        if: steps.cache-fuse.outputs.cache-hit == 'true'
        run: |
          sudo tar xf /tmp/fuse318-installed/install.tar -C /
          sudo ldconfig

      - name: Save libfuse 3.18
        if: steps.cache-fuse.outputs.cache-hit != 'true'
        run: |
          cd /
          sudo tar cf /tmp/fuse318-installed/install.tar \
            $(ls -d usr/local/lib/x86_64-linux-gnu/libfuse3.so* \
            usr/local/lib/x86_64-linux-gnu/pkgconfig/fuse3.pc) \
            usr/local/include/fuse3
          sudo ldconfig

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2026-07-29

      - name: Restore and save Cargo build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release
          add-job-id-key: false
          cache-workspace-crates: true

      - name: Build workspace
        run: cargo build --release --workspace --locked

      - name: Check CGI route references
        run: '! grep -RIn "mfs\\.cgi" docker/plfscgi --exclude-dir=__pycache__'

      - name: Check executables
        run: |
          set -euo pipefail
          target/release/plfsmaster -v
          target/release/plfschunkserver -v
          target/release/plfsmetalogger -v
          target/release/plfsgui -v
          target/release/plfsmount --version
          target/release/plfsbdev --help >/dev/null || true
          file target/release/plfsmaster target/release/plfsmount
          readelf --version-info target/release/plfsmaster \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu | tail -3

      - name: Upload release executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plfs-dist-${{ github.sha }}
          path: |
            target/release/plfsmaster
            target/release/plfschunkserver
            target/release/plfsmetalogger
            target/release/plfsgui
            target/release/plfsmount
            target/release/plfsbdev
            target/release/plfsnetdump
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  smoke:
    name: Cluster smoke test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes zlib1g libpcap0.8 meson ninja-build pkg-config curl

      - name: Cache libfuse 3.18
        id: cache-fuse
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/fuse318-installed
          key: libfuse-3.18.2-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build libfuse 3.18
        if: steps.cache-fuse.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install --yes gcc libc6-dev python3
          curl -sSL https://github.com/libfuse/libfuse/releases/download/fuse-3.18.2/fuse-3.18.2.tar.gz | tar xz -C /tmp
          meson setup /tmp/fuse-3.18.2/build /tmp/fuse-3.18.2 -Dexamples=false -Dtests=false -Dutils=false
          ninja -C /tmp/fuse-3.18.2/build
          sudo ninja -C /tmp/fuse-3.18.2/build install
          mkdir -p /tmp/fuse318-installed

      - name: Restore libfuse 3.18
        if: steps.cache-fuse.outputs.cache-hit == 'true'
        run: sudo tar xf /tmp/fuse318-installed/install.tar -C / && sudo ldconfig

      - name: Save libfuse 3.18
        if: steps.cache-fuse.outputs.cache-hit != 'true'
        run: |
          cd /
          sudo tar cf /tmp/fuse318-installed/install.tar \
            $(ls -d usr/local/lib/x86_64-linux-gnu/libfuse3.so* \
            usr/local/lib/x86_64-linux-gnu/pkgconfig/fuse3.pc) \
            usr/local/include/fuse3
          sudo ldconfig

      - name: Download release executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plfs-dist-${{ github.sha }}
          path: target/release

      - name: Run cluster smoke test
        run: |
          set +e
          chmod +x target/release/plfs*
          sudo sh -c 'ulimit -c unlimited && sysctl -w kernel.core_pattern=core.%e.%p && LD_LIBRARY_PATH=/usr/local/lib/x86_64-linux-gnu bash tools/smoke_test.sh'
          rc=$?
          mkdir -p target/smoke-artifacts
          sudo sh -c 'cp -f target/release/plfsmount core* target/smoke/*.log target/smoke/inner.sh target/smoke-artifacts/ 2>/dev/null'
          sudo chown -R "$(id -u):$(id -g)" target/smoke-artifacts
          sudo rm -rf target/smoke core*
          exit $rc

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plfsmount-crash-${{ github.sha }}
          path: target/smoke-artifacts/
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Build container image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download release executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plfs-dist-${{ github.sha }}
          path: target/release

      - name: Build container image
        run: |
          set -euo pipefail
          revision=${GITHUB_SHA::12}
          chmod +x target/release/plfs*
          docker pull ghcr.io/webj8/polaris-fs:latest || true
          docker build --cache-from ghcr.io/webj8/polaris-fs:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "polaris-fs:$revision" --file docker/Dockerfile .
          docker run --rm --entrypoint sh "polaris-fs:$revision" -c \
            'ldd /usr/local/sbin/plfsmount | grep -q /usr/local/lib64/libfuse3.so.4 && grep -q "Version: 3.18.2" /usr/local/lib64/pkgconfig/fuse3.pc'
          docker save "polaris-fs:$revision" | gzip -1 > target/polaris-fs-image.tar.gz

      - name: Upload container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plfs-image-${{ github.sha }}
          path: target/polaris-fs-image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish GHCR image
    needs: [gates, test, smoke, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plfs-image-${{ github.sha }}
          path: target/image

      - name: Publish verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=ghcr.io/webj8/polaris-fs
          revision=${GITHUB_SHA::12}
          gzip -dc target/image/polaris-fs-image.tar.gz | docker load
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "polaris-fs:$revision" "$image:$revision"
          docker tag "polaris-fs:$revision" "$image:latest"
          docker push "$image:$revision"
          docker push "$image:latest"
