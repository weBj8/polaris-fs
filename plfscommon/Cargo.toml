[package]
name = "plfscommon"
version.workspace = true
publish = false
edition = "2024"

[lib]
name = "plfscommon"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
c2rust-bitfields = { path = "../vendor/c2rust-bitfields-0.22.1" }
libc = "0.2"
# charts PNG deflate: zlib backend = same bytes as mfscommon/charts.c deflateInit(Z_BEST_SPEED)
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib"] }
